<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egg Order Form</title>
<style>body{font-family:Arial,sans-serif;background:#fff7dd;margin:0;padding:24px;color:#322}.wrap{max-width:640px;margin:auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0002}h1{margin-top:0;color:#7b4d00}.item{display:grid;grid-template-columns:1fr 130px;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}input,select,button{box-sizing:border-box;width:100%;font-size:16px;padding:12px;border:1px solid #bbb;border-radius:10px}button{margin-top:22px;background:#7b4d00;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:16px;font-weight:bold}.ok{color:#18723c}.err{color:#a51b1b}</style></head>
<body><main class="wrap"><h1>Egg Order Form</h1><p>Enter your name and select your quantities.</p><form id="orderForm"><label for="name"><b>Name</b></label><input id="name" required maxlength="80" placeholder="Your name"><div class="item"><span><b>Balot</b><br><small>₱25 each</small></span><select id="balot"></select></div><div class="item"><span><b>Penoy</b><br><small>₱20 each</small></span><select id="penoy"></select></div><div class="item"><span><b>Pugo</b><br><small>₱25 each</small></span><select id="pugo"></select></div><div id="total" style="margin-top:18px;font-size:20px;font-weight:bold;color:#7b4d00">Total: ₱0</div><button id="submitBtn" type="submit">Submit Order</button><div id="msg" class="msg" aria-live="polite"></div></form></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwVl0LWfqO7WoKeQsNC-XZewrx11aqrsEpPQJ0hz0Jas69WfzX1RoC8vtUSt6CMwm7G/exec';
['balot','penoy','pugo'].forEach(id=>{const s=document.getElementById(id);for(let i=0;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o);}s.addEventListener('change',updateTotal);});function updateTotal(){const total=(+balot.value*25)+(+penoy.value*20)+(+pugo.value*25);document.getElementById('total').textContent='Total: ₱'+total.toLocaleString('en-PH');}
document.getElementById('orderForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim();const balot=Number(document.getElementById('balot').value),penoy=Number(document.getElementById('penoy').value),pugo=Number(document.getElementById('pugo').value);const msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');msg.className='msg';if(!name){msg.textContent='Please enter your name.';msg.classList.add('err');return;}if(balot+penoy+pugo===0){msg.textContent='Please select at least one item.';msg.classList.add('err');return;}btn.disabled=true;btn.textContent='Submitting...';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name,balot,penoy,pugo,total:(balot*25)+(penoy*20)+(pugo*25)})});msg.textContent='Order submitted!';msg.classList.add('ok');e.target.reset();updateTotal();}catch(err){msg.textContent='Could not submit order. Please try again.';msg.classList.add('err');}finally{btn.disabled=false;btn.textContent='Submit Order';}});
</script></body></html>
